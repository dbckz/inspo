[project]
name = "inspo"
version = "1.0.0"
description = "Inspirational quotes fullscreen display app"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
inspo = "inspo_app:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
